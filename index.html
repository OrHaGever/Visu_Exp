<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>דשבורד הוצאות ספקים - הצדף</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ================= THEME ================= */
:root{
  --bg:#0f172a;
  --card:#020617;
  --border:rgba(148,163,184,.28);
  --text:#e5e7eb;
  --muted:#9ca3af;
  --accent:#3b82f6;
  --success:#22c55e;
  --danger:#ef4444;
}
:root[data-theme="light"]{
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:rgba(15,23,42,.18);
  --text:#0f172a;
  --muted:#475569;
  --accent:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  font-family:Inter,system-ui;
  background:radial-gradient(circle at top left,rgba(37,99,235,.18),var(--bg) 60%);
  color:var(--text);
}

.app{
  max-width:1200px;
  margin:auto;
  min-height:100vh;
}

/* ================= HEADER ================= */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  border-bottom:1px solid var(--border);
}
header h1{
  font-size:16px;
  margin:0;
}
header .actions button{
  margin-inline-start:6px;
}

/* ================= NAV ================= */
nav{
  display:flex;
  gap:6px;
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
}
nav button{
  border-radius:999px;
  border:1px solid transparent;
  background:none;
  color:var(--muted);
  padding:6px 12px;
  cursor:pointer;
  white-space:nowrap;
}
nav button.active{
  background:rgba(59,130,246,.2);
  color:var(--text);
  border-color:var(--accent);
}

/* ================= GENERAL ================= */
main{padding:14px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
}
h2{font-size:15px;margin:0 0 10px}
label{font-size:11px;color:var(--muted)}
input,select,textarea{
  width:100%;
  padding:7px 9px;
  border-radius:10px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
}
textarea{resize:vertical}
button{
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:6px 12px;
  cursor:pointer;
  font-size:12px;
}
button.outline{
  background:none;
  border:1px solid var(--border);
  color:var(--text);
}

/* ================= TABLE ================= */
table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}
th,td{
  padding:6px;
  border-bottom:1px solid var(--border);
  text-align:right;
}
.amount-pos{color:var(--success)}
.amount-neg{color:var(--danger)}

.details{
  background:rgba(148,163,184,.08);
  padding:8px;
  border-radius:10px;
}

/* ================= MODAL ================= */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}
.modal .box{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  width:100%;
  max-width:420px;
  border:1px solid var(--border);
}
.modal h3{margin-top:0}

/* ================= MOBILE ================= */
@media(max-width:768px){
  table{font-size:10px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <h1>דשבורד הוצאות ספקים - הצדף</h1>
  <div class="actions">
    <button id="themeBtn" class="outline">מצב בהיר</button>
    <button id="exportBtn" class="outline">ייצוא JSON</button>
    <button id="importBtn" class="outline">ייבוא</button>
    <input type="file" id="fileInput" hidden>
  </div>
</header>

<nav>
  <button class="tab active" data-screen="dashboard">דשבורד</button>
  <button class="tab" data-screen="documents">מסמכים</button>
  <button class="tab" data-screen="suppliers">ספקים</button>
  <button class="tab" data-screen="items">פריטים</button>
</nav>

<main>

<!-- ================= DASHBOARD ================= -->
<section id="dashboard" class="screen">
  <div class="card">
    <h2>סיכום חודשי</h2>

    <label>חודש</label>
    <input type="month" id="monthInput">

    <label>מחזור (הכנסות)</label>
    <input type="number" id="incomeInput">

    <p>סה״כ הוצאות: <strong id="expSum">₪0</strong></p>
    <p>רווח נקי: <strong id="netSum">₪0</strong></p>
  </div>
</section>

<!-- ================= DOCUMENTS ================= -->
<section id="documents" class="screen" style="display:none">
  <div class="card">
    <h2>מסמכים</h2>
    <button id="addDoc">מסמך חדש</button>

    <table>
      <thead>
        <tr>
          <th>תאריך</th>
          <th>ספק</th>
          <th>סכום</th>
          <th>פריטים</th>
          <th>הרחב</th>
        </tr>
      </thead>
      <tbody id="docsBody"></tbody>
    </table>
  </div>
</section>

<!-- ================= SUPPLIERS ================= -->
<section id="suppliers" class="screen" style="display:none">
  <div class="card">
    <h2>ספקים</h2>
    <button id="addSupplier">ספק חדש</button>

    <table>
      <thead>
        <tr><th>שם</th><th>קטגוריה</th></tr>
      </thead>
      <tbody id="supBody"></tbody>
    </table>
  </div>
</section>

<!-- ================= ITEMS ================= -->
<section id="items" class="screen" style="display:none">
  <div class="card">
    <h2>פריטים</h2>
    <button id="addItem">פריט חדש</button>

    <table>
      <thead>
        <tr><th>שם</th><th>מחיר</th></tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>
  </div>
</section>

</main>

<!-- ================= MODALS ================= -->
<div class="modal" id="docModal">
  <div class="box">
    <h3>מסמך חדש</h3>
    <label>תאריך</label>
    <input type="date" id="docDate">

    <label>ספק</label>
    <input type="text" id="docSupplier">

    <label>סכום</label>
    <input type="number" id="docAmount">

    <label><input type="checkbox" id="docVat" checked> להוסיף מע״מ (18%)</label>

    <button onclick="saveDoc()">שמור</button>
    <button class="outline" onclick="closeModal('docModal')">ביטול</button>
  </div>
</div>

<div class="modal" id="supplierModal">
  <div class="box">
    <h3>ספק</h3>
    <label>שם</label>
    <input id="supName">
    <label>קטגוריה</label>
    <input id="supCat">
    <button onclick="saveSupplier()">שמור</button>
    <button class="outline" onclick="closeModal('supplierModal')">ביטול</button>
  </div>
</div>

<div class="modal" id="itemModal">
  <div class="box">
    <h3>פריט</h3>
    <label>שם</label>
    <input id="itemName">
    <label>מחיר</label>
    <input type="number" id="itemPrice">
    <button onclick="saveItem()">שמור</button>
    <button class="outline" onclick="closeModal('itemModal')">ביטול</button>
  </div>
</div>

<script>
const KEY="supplier-dashboard-final";
let state={suppliers:[],items:[],months:{},currentMonth:""};

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){
  const r=localStorage.getItem(KEY);
  if(r) state=JSON.parse(r);
  if(!state.currentMonth){
    state.currentMonth=new Date().toISOString().slice(0,7);
    state.months[state.currentMonth]={income:0,docs:[]}
  }
}
function openModal(id){document.getElementById(id).style.display="flex"}
function closeModal(id){document.getElementById(id).style.display="none"}

function switchScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.screen===id));
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchScreen(b.dataset.screen));

document.getElementById("themeBtn").onclick=()=>{
  const t=document.documentElement.dataset.theme==="light"?"dark":"light";
  document.documentElement.dataset.theme=t;
  document.getElementById("themeBtn").textContent=t==="light"?"מצב לילה":"מצב בהיר";
};

document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="suppliers.json";
  a.click();
};

document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{state=JSON.parse(r.result);save();location.reload()};
  r.readAsText(f);
};

function renderDashboard(){
  const m=state.months[state.currentMonth];
  let exp=0;
  m.docs.forEach(d=>exp+=d.amount);
  document.getElementById("expSum").textContent="₪"+exp.toFixed(2);
  document.getElementById("netSum").textContent="₪"+(m.income-exp).toFixed(2);
}

function renderDocs(){
  const body=document.getElementById("docsBody");
  body.innerHTML="";
  state.months[state.currentMonth].docs.forEach(d=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${d.date}</td>
      <td>${d.supplier}</td>
      <td class="${d.amount>=0?"amount-pos":"amount-neg"}">₪${d.amount.toFixed(2)}</td>
      <td>-</td>
      <td></td>`;
    body.appendChild(tr);
  });
}

function renderSuppliers(){
  const b=document.getElementById("supBody");
  b.innerHTML="";
  state.suppliers.forEach(s=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${s.name}</td><td>${s.cat}</td>`;
    b.appendChild(tr);
  });
}

function renderItems(){
  const b=document.getElementById("itemsBody");
  b.innerHTML="";
  state.items.forEach(i=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${i.name}</td><td>${i.price}</td>`;
    b.appendChild(tr);
  });
}

function saveDoc(){
  const m=state.months[state.currentMonth];
  let amt=+docAmount.value||0;
  if(docVat.checked) amt*=1.18;
  m.docs.push({date:docDate.value,supplier:docSupplier.value,amount:amt});
  save();closeModal("docModal");renderDocs();renderDashboard();
}

function saveSupplier(){
  state.suppliers.push({name:supName.value,cat:supCat.value});
  save();closeModal("supplierModal");renderSuppliers();
}

function saveItem(){
  state.items.push({name:itemName.value,price:+itemPrice.value});
  save();closeModal("itemModal");renderItems();
}

addDoc.onclick=()=>openModal("docModal");
addSupplier.onclick=()=>openModal("supplierModal");
addItem.onclick=()=>openModal("itemModal");

load();
monthInput.value=state.currentMonth;
incomeInput.oninput=e=>{state.months[state.currentMonth].income=+e.target.value||0;save();renderDashboard()}

renderDashboard();
renderDocs();
renderSuppliers();
renderItems();
</script>

</div>
</body>
</html>
