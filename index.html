<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ניהול ספקים</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* צבעי רקע בהירים יותר */
  --bg-body:#162447;
  --bg-main:#1b3561;
  --bg-card:#23395d;
  --bg-card-soft:#243c63;
  --border-card:#2c4882;
  --accent:#6aa7ff;
  --accent-hover:#4d8cf5;
  --text-main:#eef2ff;
  --text-soft:#a5b8da;
  --text-muted:#7f91b7;
  --success:#34d399;
  --warn:#f59e0b;
  --danger:#ef4444;
}
*{box-sizing:border-box;font-family:"Inter",sans-serif;}
body{margin:0;background:var(--bg-body);color:var(--text-main);}
header{background:var(--bg-main);padding:.5rem;position:sticky;top:0;z-index:2;}
nav{background:var(--bg-main);display:flex;gap:.5rem;justify-content:center;padding:.4rem;border-bottom:1px solid var(--border-card);}
nav button{background:var(--bg-card);color:var(--text-soft);border:1px solid var(--border-card);padding:.4rem .8rem;border-radius:1rem;cursor:pointer;}
nav button.active{background:var(--accent);color:#162447;}
main{padding:1rem;max-width:1100px;margin:auto;}
section{display:none;}
section.active{display:block;}
.card{background:var(--bg-card);border:1px solid var(--border-card);border-radius:1rem;padding:1rem;margin-bottom:1rem;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid var(--border-card);padding:.5rem;text-align:center;}
th{background:var(--bg-main);}
tr:nth-child(even){background:var(--bg-card);}
.pill{padding:.2rem .5rem;border-radius:1rem;font-size:.75rem;}
.pill-delivery{background:#a7c7e7;color:#1d4f91;}
.pill-invoice{background:#b9e6d3;color:#175d3f;}
.btn-ghost{background:none;border:none;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:.75rem;}
/* nav responsive */
@media(max-width:768px){
nav{flex-wrap:wrap;}
}
</style>
</head>
<body>
<header>
<h1 style="margin:0;font-size:1.2rem;">ניהול ספקים · תעודות משלוח וחשבוניות</h1>
</header>
<nav>
<button class="active" onclick="switchTab('dashboard',this)">דשבורד</button>
<button onclick="switchTab('entries',this)">תנועות</button>
<button onclick="switchTab('reconcile',this)">התאמת סוף חודש</button>
<button onclick="switchTab('categories',this)">קטגוריות</button>
<button onclick="switchTab('suppliers',this)">ספקים</button>
</nav>

<main>
<section id="dashboard" class="active">
<div class="card">
<h2>דשבורד</h2>
<p>כאן יוצגו נתונים חודשיים ותרשימים.</p>
</div>
</section>

<section id="entries">
<div class="card">
<h2>הוסף תנועה</h2>
<form onsubmit="addEntry(event)">
<select id="entryType">
<option value="delivery">תעודת משלוח</option>
<option value="invoice">חשבונית</option>
</select>
<input list="supplierList" id="entrySupplier" placeholder="ספק">
<input type="text" id="entryNumber" placeholder="מספר">
<input type="date" id="entryDate">
<input type="number" id="entryAmount" placeholder="סכום">
<textarea id="entryNotes" placeholder="הערות"></textarea>
<button type="submit">הוסף</button>
</form>
</div>
<div class="card">
<h2>תנועות</h2>
<table id="entriesTable">
<thead><tr><th>#</th><th>סוג</th><th>ספק</th><th>מס'</th><th>תאריך</th><th>סכום</th><th>סטטוס</th><th>הערות</th><th>מחק</th></tr></thead>
<tbody></tbody>
</table>
</div>
</section>

<section id="reconcile">
<div class="card">
<h2>התאמת סוף חודש</h2>
<table id="reconcileTable">
<thead><tr><th>#</th><th>ספק</th><th>סה"כ משלוחים</th><th>סה"כ חשבוניות</th><th>הפרש</th><th>סטטוס</th></tr></thead>
<tbody></tbody>
</table>
</div>
</section>

<section id="categories">
<div class="card">
<h2>קטגוריות</h2>
<form onsubmit="addCategory(event)">
<input type="text" id="categoryName" placeholder="שם קטגוריה">
<button type="submit">הוסף</button>
</form>
<table id="categoriesTable">
<thead><tr><th>#</th><th>שם</th><th>עריכה</th><th>מחק</th></tr></thead>
<tbody></tbody>
</table>
</div>
</section>

<section id="suppliers">
<div class="card">
<h2>ספקים</h2>
<!-- בלי טופס עריכה, רק אוסיף ספק חדש -->
<form onsubmit="addSupplier(event)">
<input type="text" id="supplierName" placeholder="שם ספק">
<select id="supplierCategory"></select>
<input type="text" id="supplierPhone" placeholder="טלפון">
<input type="email" id="supplierEmail" placeholder="אימייל">
<textarea id="supplierNotes" placeholder="הערות"></textarea>
<button type="submit">הוסף ספק</button>
</form>
<table id="suppliersTable">
<thead><tr><th>#</th><th>שם</th><th>קטגוריה</th><th>טלפון</th><th>אימייל</th><th>הערות</th><th>עריכה</th><th>מחק</th></tr></thead>
<tbody></tbody>
</table>
</div>
</section>
</main>

<datalist id="supplierList"></datalist>

<script>
// נתונים נשמרים ב-localStorage
const STORAGE_KEY="supplier_delivery_invoice_v2";
const AUTO_CATEGORIES={
  "מדחסקור אוניברסל":"ציוד וכלי מטבח",
  "מדג סי פרוט בע״מ":"בשר ודגים",
  "קנקון":"ירקות ופירות"
  // הוסף מפות לפי הצורך
};
let state={suppliers:[],categories:[],months:{},currentMonth:""};

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function load(){
 const data=localStorage.getItem(STORAGE_KEY);
 if(data) state=JSON.parse(data);
}
function init(){
 load();
 if(!state.categories.length){
   state.categories=["ירקות ופירות","בשר ודגים","מוצרי חלב","ציוד וכלי מטבח"];
 }
 if(!state.suppliers.length){
   // דוגמאות עם קטגוריות אוטומטיות
   Object.keys(AUTO_CATEGORIES).forEach(name=>{
     state.suppliers.push({
       name,
       category:AUTO_CATEGORIES[name],
       phone:"",
       email:"",
       notes:""
     });
   });
 }
 if(!state.currentMonth){
   const d=new Date();
   state.currentMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
   state.months[state.currentMonth]={deliveries:[],invoices:[]};
 }
 renderCategories();
 renderSuppliers();
 renderSupplierOptions();
 renderEntries();
 renderReconcile();
}

function switchTab(id,btn){
 document.querySelectorAll("section").forEach(sec=>sec.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
}

function addCategory(e){
 e.preventDefault();
 const name=document.getElementById("categoryName").value.trim();
 if(name && !state.categories.includes(name)){
  state.categories.push(name);
  document.getElementById("categoryName").value="";
  renderCategories();
  save();
 }
}

function renderCategories(){
 const body=document.querySelector("#categoriesTable tbody");
 body.innerHTML="";
 state.categories.forEach((cat,i)=>{
   const tr=document.createElement("tr");
   tr.innerHTML=`<td>${i+1}</td><td>${cat}</td>
   <td><button class="btn-ghost" onclick="editCategory(${i})">עריכה</button></td>
   <td><button class="btn-ghost" onclick="deleteCategory(${i})">מחק</button></td>`;
   body.appendChild(tr);
 });
 renderCategorySelect();
}
function editCategory(i){
 const newName=prompt("שם חדש:",state.categories[i]);
 if(newName){
   // עדכן
   const old=state.categories[i];
   state.categories[i]=newName;
   // עדכן ספקים המשוייכים לקטגוריה זו
   state.suppliers.forEach(s=>{ if(s.category===old) s.category=newName; });
   renderCategories(); renderSuppliers();
   save();
 }
}
function deleteCategory(i){
 const name=state.categories[i];
 if(confirm(`למחוק קטגוריה ${name}?`)){
  state.categories.splice(i,1);
  state.suppliers.forEach(s=>{ if(s.category===name) s.category=""; });
  renderCategories(); renderSuppliers();
  save();
 }
}

function renderCategorySelect(){
 const sel=document.getElementById("supplierCategory");
 if(!sel) return;
 sel.innerHTML=`<option value="">ללא</option>`;
 state.categories.forEach(c=>{
   const opt=document.createElement("option");
   opt.value=c; opt.textContent=c;
   sel.appendChild(opt);
 });
}

function addSupplier(e){
 e.preventDefault();
 const name=document.getElementById("supplierName").value.trim();
 const cat=document.getElementById("supplierCategory").value.trim();
 const phone=document.getElementById("supplierPhone").value.trim();
 const email=document.getElementById("supplierEmail").value.trim();
 const notes=document.getElementById("supplierNotes").value.trim();
 if(name){
   state.suppliers.push({name,category:cat,phone,email,notes});
   // נקה
   document.getElementById("supplierName").value="";
   document.getElementById("supplierPhone").value="";
   document.getElementById("supplierEmail").value="";
   document.getElementById("supplierNotes").value="";
   renderSuppliers(); renderSupplierOptions(); save();
 }
}

function renderSupplierOptions(){
 const dl=document.getElementById("supplierList");
 dl.innerHTML="";
 state.suppliers.forEach(s=>{
   const opt=document.createElement("option");
   opt.value=s.name;
   dl.appendChild(opt);
 });
}

function renderSuppliers(){
 const tbody=document.querySelector("#suppliersTable tbody");
 tbody.innerHTML="";
 state.suppliers.forEach((s,i)=>{
   const tr=document.createElement("tr");
   if(tr){
     tr.innerHTML=`
      <td>${i+1}</td>
      <td>${s.name}</td>
      <td>${s.category||"לא משויך"}</td>
      <td>${s.phone}</td>
      <td>${s.email}</td>
      <td>${s.notes}</td>
      <td><button class="btn-ghost" onclick="editSupplier(${i})">עריכה</button></td>
      <td><button class="btn-ghost" onclick="deleteSupplier(${i})">מחק</button></td>`;
     tbody.appendChild(tr);
   }
 });
}

function editSupplier(i){
 // עריכה inline: הפוך את השורה לשדות
 const tbody=document.querySelector("#suppliersTable tbody");
 const row=tbody.children[i];
 const s=state.suppliers[i];
 row.innerHTML=`
 <td>${i+1}</td>
 <td><input id="ed-name" value="${s.name}"></td>
 <td><select id="ed-cat"></select></td>
 <td><input id="ed-phone" value="${s.phone}"></td>
 <td><input id="ed-email" value="${s.email}"></td>
 <td><input id="ed-notes" value="${s.notes}"></td>
 <td colspan="2">
   <button class="btn-ghost" onclick="saveEditSupplier(${i})">שמור</button>
   <button class="btn-ghost" onclick="cancelEditSupplier()">ביטול</button>
 </td>`;
 // מילוי קטגוריות
 const sel=row.querySelector("#ed-cat");
 state.categories.forEach(c=>{
  const opt=document.createElement("option");
  opt.value=c; opt.textContent=c;
  if(c===s.category) opt.selected=true;
  sel.appendChild(opt);
 });
}

function saveEditSupplier(i){
 const row=document.querySelector("#suppliersTable tbody").children[i];
 const name=row.querySelector("#ed-name").value.trim();
 const cat=row.querySelector("#ed-cat").value;
 const phone=row.querySelector("#ed-phone").value;
 const email=row.querySelector("#ed-email").value;
 const notes=row.querySelector("#ed-notes").value;
 if(name){
   state.suppliers[i]={name,category:cat,phone,email,notes};
   renderSuppliers();
   renderSupplierOptions();
   save();
 }
}

function cancelEditSupplier(){
 renderSuppliers();
}

function deleteSupplier(i){
 if(confirm("למחוק ספק?")){
   state.suppliers.splice(i,1);
   renderSuppliers(); renderSupplierOptions(); save();
 }
}

function addEntry(e){
 e.preventDefault();
 const type=document.getElementById("entryType").value;
 const supplier=document.getElementById("entrySupplier").value.trim();
 const number=document.getElementById("entryNumber").value.trim();
 const date=document.getElementById("entryDate").value;
 const amount=parseFloat(document.getElementById("entryAmount").value||0);
 const notes=document.getElementById("entryNotes").value.trim();
 if(!state.months[state.currentMonth]) state.months[state.currentMonth]={deliveries:[],invoices:[]};
 if(supplier && number && amount){
   const obj={supplier,number,date,amount,notes};
   state.months[state.currentMonth][type==="delivery"?"deliveries":"invoices"].push(obj);
   document.getElementById("entrySupplier").value="";
   document.getElementById("entryNumber").value="";
   document.getElementById("entryAmount").value="";
   document.getElementById("entryNotes").value="";
   renderEntries(); renderReconcile(); save();
 }
}

function renderEntries(){
 const tbody=document.querySelector("#entriesTable tbody");
 tbody.innerHTML="";
 const month=state.months[state.currentMonth]||{deliveries:[],invoices:[]};
 let idx=1;
 month.deliveries.forEach((d,i)=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${idx++}</td><td><span class="pill pill-delivery">תעודת משלוח</span></td><td>${d.supplier}</td><td>${d.number}</td><td>${d.date}</td><td>${d.amount}</td><td>לא נבדק</td><td>${d.notes}</td><td><button class="btn-ghost" onclick="deleteEntry('delivery',${i})">מחיקה</button></td>`;
  tbody.appendChild(tr);
 });
 month.invoices.forEach((f,j)=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${idx++}</td><td><span class="pill pill-invoice">חשבונית</span></td><td>${f.supplier}</td><td>${f.number}</td><td>${f.date}</td><td>${f.amount}</td><td>לא נבדק</td><td>${f.notes}</td><td><button class="btn-ghost" onclick="deleteEntry('invoice',${j})">מחיקה</button></td>`;
  tbody.appendChild(tr);
 });
}

function deleteEntry(type,index){
 if(!state.months[state.currentMonth]) return;
 const m=state.months[state.currentMonth];
 if(type==="delivery") m.deliveries.splice(index,1); else m.invoices.splice(index,1);
 renderEntries(); renderReconcile(); save();
}

function renderReconcile(){
 const tbody=document.querySelector("#reconcileTable tbody");
 tbody.innerHTML="";
 const m=state.months[state.currentMonth]||{deliveries:[],invoices:[]};
 const totals={};
 m.deliveries.forEach(d=>{
  totals[d.supplier]=(totals[d.supplier]||{del:0,inv:0});
  totals[d.supplier].del+=(d.amount||0);
 });
 m.invoices.forEach(f=>{
  totals[f.supplier]=(totals[f.supplier]||{del:0,inv:0});
  totals[f.supplier].inv+=(f.amount||0);
 });
 let i=1;
 Object.keys(totals).forEach(name=>{
  const del=totals[name].del||0;
  const inv=totals[name].inv||0;
  const diff=inv-del;
  const status=Math.abs(diff)<=10?"תואם":diff>0?"עודף":"חסר";
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${i++}</td><td>${name}</td><td>${del}</td><td>${inv}</td><td>${diff}</td><td>${status}</td>`;
  tbody.appendChild(tr);
 });
}

window.addEventListener('load',init);
</script>
</body>
</html>
