<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ניהול הוצאות</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

  <header>
    <h1>ניהול הוצאות</h1>
  </header>

  <nav class="tabs">
    <button data-tab="dashboard" class="active">דשבורד</button>
    <button data-tab="documents">מסמכים</button>
    <button data-tab="suppliers">ספקים</button>
    <button data-tab="items">פריטים</button>
    <button data-tab="categories">קטגוריות</button>
  </nav>

  <main>

    <!-- DASHBOARD -->
    <section id="dashboard" class="screen">
      <div class="cards">
        <div class="card">
          <div class="label">סה״כ הוצאות</div>
          <div class="value" id="kpiTotal">₪0.00</div>
        </div>
        <div class="card">
          <div class="label">מספר רשומות</div>
          <div class="value" id="kpiCount">0</div>
        </div>
        <div class="card">
          <div class="label">ממוצע</div>
          <div class="value" id="kpiAvg">₪0.00</div>
        </div>
      </div>
    </section>

    <!-- DOCUMENTS -->
    <section id="documents" class="screen hide">

      <form id="invoiceForm" class="form">
        <h3>הוספת מסמך</h3>

        <label>תאריך
          <input type="date" id="invDate" required>
        </label>

        <label>ספק
          <select id="invSupplier" required></select>
        </label>

        <label>מספר מסמך
          <input type="text" id="invNumber">
        </label>

        <label>סכום
          <input type="number" id="invAmount" step="0.01" required>
        </label>

        <label>סוג
          <select id="invType">
            <option value="recurring">קבוע</option>
            <option value="oneoff">חד־פעמי</option>
          </select>
        </label>

        <label>
          <input type="checkbox" id="invPaid">
          שולם
        </label>

        <button type="submit">הוסף</button>
      </form>

      <table id="invoicesTable">
        <thead>
          <tr>
            <th>תאריך</th>
            <th>ספק</th>
            <th>מס׳</th>
            <th>סכום</th>
            <th>סוג</th>
            <th>סטטוס</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </section>

    <!-- SUPPLIERS -->
    <section id="suppliers" class="screen hide">

      <form id="supplierForm" class="form">
        <h3>ספק חדש</h3>

        <label>שם
          <input type="text" id="supName" required>
        </label>

        <label>קטגוריה
          <select id="supCategory"></select>
        </label>

        <label>טלפון
          <input type="text" id="supPhone" placeholder="אופציונלי">
        </label>

        <label>הערות
          <input type="text" id="supNotes" placeholder="אופציונלי">
        </label>

        <button type="submit">שמור</button>
      </form>

      <table id="suppliersTable">
        <thead>
          <tr>
            <th>שם ספק</th>
            <th>קטגוריה</th>
            <th>טלפון</th>
            <th>הערות</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </section>

    <!-- ITEMS -->
    <section id="items" class="screen hide">

      <form id="itemForm" class="form">
        <h3>פריט חדש</h3>

        <label>שם
          <input type="text" id="itemName" required>
        </label>

        <label>קטגוריה
          <select id="itemCategory"></select>
        </label>

        <label>מחיר
          <input type="number" id="itemPrice" step="0.01">
        </label>

        <label>יחידה
          <input type="text" id="itemUnit" placeholder='למשל: ק״ג / יח׳'>
        </label>

        <button type="submit">שמור</button>
      </form>

      <table id="itemsTable">
        <thead>
          <tr>
            <th>שם פריט</th>
            <th>קטגוריה</th>
            <th>מחיר</th>
            <th>יחידה</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </section>

    <!-- CATEGORIES -->
    <section id="categories" class="screen hide">

      <form id="categoryForm" class="form">
        <h3>קטגוריה חדשה</h3>

        <label>שם
          <input type="text" id="catName" required>
        </label>

        <button type="submit">שמור</button>
      </form>

      <table id="categoriesTable">
        <thead>
          <tr>
            <th>שם קטגוריה</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </section>

  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
