<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול הוצאות עסק</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Assistant', sans-serif;
      direction: rtl;
    }
    body {
      margin: 0;
      background: #f4f6f9;
      color: #333;
    }
    header {
      background: #007acc;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 600;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #e3e8ef;
      padding: 0.5rem;
    }
    nav button {
      margin: 0 1rem;
      padding: 0.5rem 1rem;
      background: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    nav button:hover {
      background: #d2e7fa;
    }
    section {
      display: none;
      padding: 2rem;
    }
    section.active {
      display: block;
    }
    form {
      background: white;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    form h3 {
      margin-top: 0;
      color: #007acc;
    }
    form label {
      display: block;
      margin: 1rem 0 0.3rem;
      font-weight: 600;
    }
    form input, form select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    form button {
      margin-top: 1rem;
      padding: 0.7rem 1.2rem;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 0.75rem;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #007acc;
      color: white;
    }
    tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <header>ניהול הוצאות עסק</header>
  <nav>
    <button onclick="switchTab('suppliers')">ספקים</button>
    <button onclick="switchTab('invoices')">חשבוניות</button>
    <button onclick="switchTab('summary')">סיכום</button>
  </nav>

  <section id="suppliers" class="active">
    <form onsubmit="addSupplier(event)">
      <h3>הוספת ספק</h3>
      <label>שם ספק</label>
      <input type="text" id="supplierName" required>
      <button>הוסף ספק</button>
    </form>
    <table id="suppliersTable">
      <thead><tr><th>#</th><th>שם ספק</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="invoices">
    <form onsubmit="addInvoice(event)">
      <h3>הוספת חשבונית</h3>
      <label>שם ספק</label>
      <select id="invoiceSupplier" required></select>
      <label>מספר חשבונית</label>
      <input type="text" id="invoiceNumber" required>
      <label>סכום</label>
      <input type="number" id="invoiceAmount" required>
      <label>תשלום</label>
      <select id="invoiceType">
        <option value="קבוע">קבוע</option>
        <option value="חד פעמי">חד פעמי</option>
      </select>
      <button>הוסף חשבונית</button>
    </form>
    <table id="invoicesTable">
      <thead><tr><th>ספק</th><th># חשבונית</th><th>סכום</th><th>תשלום</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="summary">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
      <h3>סיכום לפי ספק</h3>
      <button type="button" onclick="exportData()">ייצוא נתונים (CSV)</button>
    </div>
    <table id="summaryTable">
      <thead><tr><th>ספק</th><th>סה"כ</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <script>
    const suppliers = ["סוקוליק","החברה המרכזית","ביסקוטי","ניקיון חודשי","חלב וגלידות","ירקות ופירות"]
    const invoices = []

    // מילוי טבלת ספקים ותיבת הבחירה כבר בטעינה
    updateSupplierTable()
    updateSupplierSelect()

    function switchTab(tabId) {
      document.querySelectorAll("section").forEach(s => s.classList.remove("active"))
      document.getElementById(tabId).classList.add("active")
      if (tabId === 'summary') updateSummary()
    }

    function addSupplier(e) {
      e.preventDefault()
      const name = document.getElementById("supplierName").value.trim()
      if (!name) return
      suppliers.push(name)
      document.getElementById("supplierName").value = ""
      updateSupplierTable()
      updateSupplierSelect()
    }

    function updateSupplierTable() {
      const tbody = document.querySelector("#suppliersTable tbody")
      tbody.innerHTML = ""
      suppliers.forEach((name, i) => {
        const tr = document.createElement("tr")
        tr.innerHTML = `<td>${i + 1}</td><td>${name}</td>`
        tbody.appendChild(tr)
      })
    }

    function updateSupplierSelect() {
      const select = document.getElementById("invoiceSupplier")
      select.innerHTML = ""
      suppliers.forEach(name => {
        const opt = document.createElement("option")
        opt.value = name
        opt.textContent = name
        select.appendChild(opt)
      })
    }

    function addInvoice(e) {
      e.preventDefault()
      const supplier = document.getElementById("invoiceSupplier").value
      const number = document.getElementById("invoiceNumber").value.trim()
      const amount = parseFloat(document.getElementById("invoiceAmount").value)
      const type = document.getElementById("invoiceType").value
      if (!supplier || !number || isNaN(amount)) return
      invoices.push({ supplier, number, amount, type })
      document.getElementById("invoiceNumber").value = ""
      document.getElementById("invoiceAmount").value = ""
      updateInvoiceTable()
    }

    function updateInvoiceTable() {
      const tbody = document.querySelector("#invoicesTable tbody")
      tbody.innerHTML = ""
      invoices.forEach(inv => {
        const tr = document.createElement("tr")
        tr.innerHTML = `<td>${inv.supplier}</td><td>${inv.number}</td><td>${inv.amount.toFixed(2)}</td><td>${inv.type}</td>`
        tbody.appendChild(tr)
      })
    }

    function updateSummary() {
      const summary = {}
      invoices.forEach(({ supplier, amount }) => {
        if (!summary[supplier]) summary[supplier] = 0
        summary[supplier] += amount
      })
      const tbody = document.querySelector("#summaryTable tbody")
      tbody.innerHTML = ""
      Object.entries(summary).forEach(([name, total]) => {
        const tr = document.createElement("tr")
        tr.innerHTML = `<td>${name}</td><td>${total.toFixed(2)}</td>`
        tbody.appendChild(tr)
      })
    }
      function exportData() {
      if (!suppliers.length && !invoices.length) {
        alert("אין נתונים לייצוא")
        return
      }

      let csv = "ספק,מספר חשבונית,סכום,סוג תשלום\n"
      invoices.forEach(inv => {
        csv += `"${inv.supplier}","${inv.number}",${inv.amount},"${inv.type}"\n`
      })

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" })
      const url = URL.createObjectURL(blob)
      const a = document.createElement("a")
      a.href = url
      a.download = "expenses.csv"
      document.body.appendChild(a)
      a.click()
      document.body.removeChild(a)
      URL.revokeObjectURL(url)
    }
  </script>
</body>
</html>
