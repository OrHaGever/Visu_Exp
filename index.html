<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>דשבורד הוצאות ספקים - הצדף</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- פונט Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f5f5f7;
      --bg-elevated: #ffffff;
      --bg-soft: #f0f2ff;
      --border-subtle: #e2e4f0;
      --border-strong: #c7c9e0;
      --primary: #2563eb;
      --primary-soft: #e0edff;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #0f172a;
      --text-muted: #6b7280;
      --pill-bg: #e5edff;
      --pill-text: #1d4ed8;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-soft: 0 18px 40px rgba(15,23,42,0.08);
      --shadow-subtle: 0 10px 24px rgba(15,23,42,0.06);
      --fab-size: 52px;
    }

    body.dark-mode {
      --bg-main: #1c1c1e;
      --bg-elevated: #2a2a2d;
      --bg-soft: #1f2430;
      --border-subtle: #3a3a42;
      --border-strong: #4b4b5b;
      --primary: #0a84ff;
      --primary-soft: #283241;
      --accent: #4cd964;
      --danger: #ff453a;
      --warning: #ffd60a;
      --text-main: #f5f5f7;
      --text-muted: #a1a1b5;
      --pill-bg: #283241;
      --pill-text: #93c5fd;
      --shadow-soft: 0 18px 40px rgba(0,0,0,0.8);
      --shadow-subtle: 0 12px 30px rgba(0,0,0,0.7);
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body {
      margin: 0;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(129,140,248,0.16) 0, transparent 50%),
        radial-gradient(circle at bottom right, rgba(45,212,191,0.20) 0, transparent 55%),
        var(--bg-main);
      color: var(--text-main);
    }

    body.dark-mode {
      background:
        radial-gradient(circle at top left, rgba(37,99,235,0.35) 0, transparent 55%),
        radial-gradient(circle at bottom right, rgba(16,185,129,0.35) 0, transparent 55%),
        #0b0b10;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      box-shadow: 0 14px 30px rgba(15,23,42,0.45);
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.55rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .header-title {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .month-nav {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(15,23,42,0.18);
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      border: 1px solid rgba(191,219,254,0.4);
    }

    .month-nav button {
      border: none;
      background: none;
      color: #e5e7eb;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0 0.2rem;
    }

    .month-nav span {
      font-size: 0.78rem;
      opacity: 0.9;
      margin-inline: 0.15rem;
    }

    .month-nav input[type="month"] {
      border: none;
      background: transparent;
      color: #f9fafb;
      font-size: 0.78rem;
      padding: 0;
      cursor: pointer;
    }
    .month-nav input[type="month"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    .header-search {
      position: relative;
      min-width: 160px;
      flex: 1 1 220px;
      max-width: 360px;
    }

    .header-search input {
      width: 100%;
      padding: 0.35rem 2rem 0.35rem 0.6rem;
      border-radius: 999px;
      border: none;
      font-size: 0.8rem;
      background: rgba(15,23,42,0.2);
      color: #f9fafb;
    }

    .header-search input::placeholder {
      color: rgba(226,232,240,0.75);
    }

    .header-search-icon {
      position: absolute;
      inset-inline-start: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .header-actions {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip-btn {
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(15,23,42,0.22);
      padding: 0.3rem 0.8rem;
      font-size: 0.76rem;
      color: #e5e7eb;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.06s ease;
      white-space: nowrap;
    }

    .chip-btn:hover {
      background: rgba(15,23,42,0.35);
      transform: translateY(-0.5px);
    }

    .chip-icon {
      font-size: 0.8rem;
    }

    /* NAV */

    nav {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      background: rgba(241,245,249,0.95);
      backdrop-filter: blur(10px);
      padding: 0.45rem 0.8rem;
      position: sticky;
      top: 2.45rem;
      z-index: 30;
      border-bottom: 1px solid #d1ddf5;
    }

    body.dark-mode nav {
      background: rgba(17,24,39,0.95);
      border-bottom-color: #1f2937;
    }

    nav button {
      border-radius: 999px;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.85);
      padding: 0.35rem 1.1rem;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      color: #374151;
      transition: background 0.14s ease, color 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease, transform 0.08s ease;
      white-space: nowrap;
    }

    body.dark-mode nav button {
      background: rgba(31,41,55,0.9);
      color: #e5e7eb;
      border-color: #111827;
    }

    nav button:hover {
      background: #e0e7ff;
      border-color: #c7d2fe;
    }

    body.dark-mode nav button:hover {
      background: #111827;
      border-color: #374151;
    }

    nav button.active {
      background: #ffffff;
      border-color: #2563eb;
      color: #1d4ed8;
      box-shadow: 0 8px 18px rgba(37,99,235,0.35);
      transform: translateY(-1px);
    }

    body.dark-mode nav button.active {
      background: #020617;
      color: #bfdbfe;
      border-color: #60a5fa;
    }

    /* MAIN LAYOUT */

    main {
      max-width: 1120px;
      margin: 1.1rem auto 4.5rem;
      padding: 0 0.9rem;
    }

    section {
      display: none;
    }

    section.active {
      display: block;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.7rem;
    }

    .top-actions-left,
    .top-actions-right {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .primary-chip {
      border-radius: 999px;
      border: none;
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #f9fafb;
      box-shadow: 0 10px 24px rgba(37,99,235,0.45);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .primary-chip span.icon {
      font-size: 0.85rem;
    }

    .primary-chip:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .secondary-chip {
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: rgba(255,255,255,0.8);
      color: var(--text-main);
      padding: 0.3rem 0.8rem;
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    body.dark-mode .secondary-chip {
      background: #171821;
      color: #e5e7eb;
      border-color: #3a3a42;
    }

    /* CARDS */

    .card {
      position: relative;
      background: radial-gradient(circle at top left, rgba(255,255,255,0.85), var(--bg-elevated));
      border-radius: var(--radius-lg);
      padding: 0.9rem 1.1rem;
      margin-bottom: 0.9rem;
      box-shadow: var(--shadow-subtle);
      border: 1px solid var(--border-subtle);
    }

    body.dark-mode .card {
      background: radial-gradient(circle at top left, #363845, var(--bg-elevated));
      border-color: var(--border-subtle);
    }

    .card h3 {
      margin: 0 0 0.45rem;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
    }

    /* GRID */

    .grid-3 {
      display: grid;
      gap: 0.8rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 0.8rem;
    }

    .grid-2 {
      display: grid;
      gap: 0.8rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    @media (max-width: 860px) {
      .grid-3 {
        grid-template-columns: 1fr;
      }
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    /* KPI */

    .kpi-card {
      background: linear-gradient(145deg, #ffffff, #eef2ff);
      border-radius: 16px;
      padding: 0.85rem 0.9rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-strong);
    }

    body.dark-mode .kpi-card {
      background: linear-gradient(145deg, #272832, #1f212c);
      border-color: #3a3a42;
    }

    .kpi-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .kpi-value {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .kpi-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    /* FORM ELEMENTS */

    .row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .row.space-between {
      justify-content: space-between;
    }

    label {
      display: block;
      font-size: 0.78rem;
      margin: 0.45rem 0 0.15rem;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.48rem 0.6rem;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      font-size: 0.85rem;
      background: #f9fafb;
      color: var(--text-main);
      transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, transform 0.06s ease;
    }

    body.dark-mode input,
    body.dark-mode select,
    body.dark-mode textarea {
      background: #252732;
      border-color: #3a3a42;
      color: #f5f5f7;
    }

    input::placeholder, textarea::placeholder {
      color: #9ca3af;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37,99,235,0.18);
      background: #ffffff;
      transform: translateY(-0.5px);
    }

    body.dark-mode input:focus,
    body.dark-mode textarea:focus,
    body.dark-mode select:focus {
      background: #111827;
      box-shadow: 0 0 0 2px rgba(10,132,255,0.35);
    }

    textarea {
      resize: vertical;
      min-height: 52px;
    }

    button.primary {
      margin-top: 0.55rem;
      padding: 0.46rem 1.15rem;
      border-radius: 999px;
      border: none;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #1d9bf0);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(37,99,235,0.35);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.12s ease;
      white-space: nowrap;
    }

    button.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(37,99,235,0.45);
      filter: brightness(1.03);
    }

    button.primary.small {
      padding: 0.3rem 0.9rem;
      font-size: 0.78rem;
      box-shadow: 0 6px 14px rgba(15,23,42,0.14);
      background: #ffffff;
      color: #111827;
      border: 1px solid var(--border-subtle);
    }

    body.dark-mode button.primary.small {
      background: #12131a;
      color: #e5e7eb;
      border-color: #3a3a42;
    }

    .btn-ghost {
      border: none;
      background: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.76rem;
      text-decoration: underline;
      padding: 0.1rem 0.2rem;
    }

    body.dark-mode .btn-ghost {
      color: #93c5fd;
    }

    /* TABLES */

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      margin-top: 0.45rem;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #ffffff;
    }

    body.dark-mode table {
      background: #1f212c;
    }

    thead {
      background: linear-gradient(135deg, #e5edff, #f3f4ff);
    }

    body.dark-mode thead {
      background: #2b3040;
    }

    th, td {
      padding: 0.4rem 0.35rem;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
    }

    body.dark-mode th,
    body.dark-mode td {
      border-bottom-color: #3a3a42;
    }

    th {
      font-weight: 600;
      color: #374151;
      font-size: 0.76rem;
    }

    body.dark-mode th {
      color: #e5e7eb;
    }

    tbody tr:nth-child(even) {
      background: #f9fafb;
    }

    tbody tr:nth-child(odd) {
      background: #ffffff;
    }

    body.dark-mode tbody tr:nth-child(even) {
      background: #171821;
    }
    body.dark-mode tbody tr:nth-child(odd) {
      background: #1f212c;
    }

    tbody tr:hover {
      background: #e0f2fe;
      cursor: pointer;
    }

    body.dark-mode tbody tr:hover {
      background: #2b3040;
    }

    body.compact-tables th,
    body.compact-tables td {
      padding: 0.25rem 0.25rem;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 0.7rem;
    }

    /* STATUS & AMOUNTS */

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.7rem;
      border-radius: 999px;
      font-size: 0.72rem;
      background: var(--pill-bg);
      color: var(--pill-text);
      font-weight: 500;
      border: 1px solid rgba(191,219,254,0.8);
    }

    .status-select {
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      border-width: 1px;
      font-size: 0.72rem;
      min-width: 95px;
    }

    .status-paid {
      background-color: #dcfce7;
      border-color: #4ade80;
      color: #166534;
    }
    .status-partial {
      background-color: #fef9c3;
      border-color: #facc15;
      color: #854d0e;
    }
    .status-unpaid {
      background-color: #fee2e2;
      border-color: #f97373;
      color: #b91c1c;
    }

    .amount-charge {
      color: #b91c1c;
      font-weight: 500;
    }
    .amount-credit {
      color: #16a34a;
      font-weight: 500;
    }
    body.dark-mode .amount-charge {
      color: #ff7676;
    }
    body.dark-mode .amount-credit {
      color: #4cd964;
    }

    .badge-anomaly {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.7);
      color: #92400e;
    }

    body.dark-mode .badge-anomaly {
      background: rgba(255,214,10,0.18);
      border-color: rgba(255,214,10,0.9
