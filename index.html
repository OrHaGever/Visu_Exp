<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>דשבורד הוצאות ספקים - הצדף</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header>
      <h1>דשבורד הוצאות ספקים - הצדף</h1>
      <div class="actions">
        <span class="badge">חודש: <b id="monthBadge">—</b></span>
        <div class="btnRow">
          <button id="themeBtn" class="outline small">מצב בהיר</button>
          <button id="exportBtn" class="outline small">ייצוא JSON</button>
          <button id="importBtn" class="outline small">ייבוא</button>
          <input type="file" id="fileInput" accept=".json" hidden>
        </div>
      </div>
    </header>

    <!-- NAV -->
    <nav>
      <button class="tab active" data-screen="dashboard">דשבורד</button>
      <button class="tab" data-screen="documents">מסמכים</button>
      <button class="tab" data-screen="suppliers">ספקים</button>
      <button class="tab" data-screen="categories">קטגוריות</button>
      <button class="tab" data-screen="items">פריטים</button>
    </nav>

    <!-- MAIN -->
    <main>

      <!-- DASHBOARD -->
      <section id="dashboard" class="screen">
        <!-- התוכן נשאר בדיוק כמו שהיה אצלך -->
      </section>

      <!-- DOCUMENTS -->
      <section id="documents" class="screen hide"></section>

      <!-- SUPPLIERS -->
      <section id="suppliers" class="screen hide"></section>

      <!-- CATEGORIES -->
      <section id="categories" class="screen hide"></section>

      <!-- ITEMS -->
      <section id="items" class="screen hide"></section>

    </main>
  </div>

  <!-- TOAST -->
  <div class="toast hide" id="toast">
    <div class="tbox">
      <div class="msg" id="toastMsg">—</div>
      <button class="outline small" id="toastBtn">סגור</button>
    </div>
  </div>

  <!-- 🔑 SCRIPT: JS ENTRY POINT -->
  <!-- שים לב: אין שום <script> אחר בקובץ -->
  <script type="module" src="app.js"></script>
</body>
</html>
