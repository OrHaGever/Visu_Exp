<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול מסמכים – שלב A</title>

<style>
/* ========== THEME ========== */
:root{
  --bg:#0f172a;
  --card:#111827;
  --border:#334155;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --accent:#3b82f6;
  --green:#22c55e;
  --orange:#f59e0b;
  --blue:#38bdf8;
  --danger:#ef4444;
}
body{
  margin:0;
  font-family:system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
}
button{cursor:pointer}

/* ========== LAYOUT ========== */
header{
  padding:12px;
  border-bottom:1px solid var(--border);
  font-weight:700;
}
main{padding:12px; padding-bottom:110px;}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}
.row{display:flex; gap:8px; flex-wrap:wrap}
input,select,textarea{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
}
label{font-size:12px; color:var(--muted)}
.spacer{height:8px}

/* ========== NAV ========== */
nav{
  display:flex;
  gap:8px;
  padding:8px;
}
nav button{
  background:none;
  border:none;
  color:var(--muted);
}
nav button.active{
  color:var(--text);
  border-bottom:2px solid var(--accent);
}

/* ========== BREADCRUMBS ========== */
#breadcrumbs{
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
}
#breadcrumbs span{cursor:pointer}
#breadcrumbs span:hover{text-decoration:underline}

/* ========== DOCUMENT LIST ========== */
.supplierGroup{
  margin-bottom:12px;
}
.supplierHeader{
  font-weight:700;
  cursor:pointer;
}
.doc{
  border-left:4px solid transparent;
  padding:8px;
  margin-top:6px;
  border-radius:8px;
  background:#020617;
}
.doc.ordered{border-color:var(--blue)}
.doc.received{border-color:var(--orange)}
.doc.paid{border-color:var(--green)}
.docHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.docActions button{
  background:none;
  border:none;
  color:var(--muted);
}

/* ========== MOBILE CARD ========== */
@media (max-width:600px){
  .doc{font-size:14px}
}

/* ========== STICKY SUMMARY ========== */
#stickyBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#020617;
  border-top:1px solid var(--border);
  padding:10px;
}
#stickyBar strong{font-size:16px}

/* ========== TOAST ========== */
#toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:#020617;
  border:1px solid var(--border);
  padding:8px 12px;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<header>📄 מסמכים – שלב A</header>

<nav>
  <button class="active">מסמכים</button>
</nav>

<main>

<div id="breadcrumbs">דשבורד › מסמכים</div>

<button onclick="openNewDoc()">➕ מסמך חדש</button>

<div id="docList"></div>

</main>

<!-- STICKY SUMMARY -->
<div id="stickyBar" style="display:none">
  <div>💰 סה״כ: <strong id="sumTotal">₪0</strong></div>
  <div>סטטוס: <span id="sumStatus"></span></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
/* ========== DATA ========== */
let suppliers = [
  {id:1,name:"החברה המרכזית",items:["קולה","ספרייט"]},
  {id:2,name:"סוקוליק",items:["מים","סודה"]}
];
let itemPrices = {
  "קולה":6,
  "ספרייט":6,
  "מים":4,
  "סודה":4
};

let documents = [];
let undoStack = null;

/* ========== HELPERS ========== */
function toast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",3000);
}

/* ========== RENDER ========== */
function render(){
  const list=document.getElementById("docList");
  list.innerHTML="";
  suppliers.forEach(s=>{
    const group=document.createElement("div");
    group.className="supplierGroup";
    group.innerHTML=`<div class="supplierHeader">${s.name}</div>`;
    documents.filter(d=>d.supplier===s.name).forEach(d=>{
      const div=document.createElement("div");
      div.className=`doc ${d.status}`;
      div.innerHTML=`
        <div class="docHeader">
          <div>📄 ${d.number} – ₪${d.total}</div>
          <div class="docActions">
            <button onclick="deleteDoc(${d.id})">🗑</button>
          </div>
        </div>
        <div>סטטוס: ${d.status}</div>
        <div>אחראי: ${d.owner}</div>
      `;
      group.appendChild(div);
    });
    list.appendChild(group);
  });
}

/* ========== CRUD ========== */
function openNewDoc(){
  const supplier=suppliers[0];
  const item=supplier.items[0];
  const total=itemPrices[item];
  const doc={
    id:Date.now(),
    supplier:supplier.name,
    number:prompt("מס׳ מסמך"),
    status:"ordered",
    owner:prompt("אחראי הזמנה"),
    total
  };
  if(!doc.number){alert("חובה מס׳ מסמך");return}
  if(documents.some(d=>d.number===doc.number)){
    alert("מס׳ מסמך כפול");
    return;
  }
  documents.push(doc);
  render();
  showSummary(doc);
}

function deleteDoc(id){
  const idx=documents.findIndex(d=>d.id===id);
  undoStack=documents[idx];
  documents.splice(idx,1);
  render();
  toast("מסמך נמחק – בטל?");
  setTimeout(()=>undoStack=null,10000);
}

function showSummary(doc){
  document.getElementById("stickyBar").style.display="block";
  document.getElementById("sumTotal").innerText="₪"+doc.total;
  document.getElementById("sumStatus").innerText=doc.status;
}

/* INIT */
render();
</script>

</body>
</html>
